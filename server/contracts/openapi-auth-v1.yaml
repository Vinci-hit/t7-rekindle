openapi: 3.1.0
info:
  title: T7 Rekindle Launcher API
  version: 1.0.0
  description: |
    首页公告匿名读取，仅返回最新已发布快照；没有已发布公告时返回 204。
    普通账户的凭证与在线资格分离。Session 创建后固定有效 30 天，无 refresh 接口。
    登录不占用在线资格；显式上线接管当前连接。被接管的 session 仍可鉴权。
    QQ 登录会撤销该账号其他机器上的 session，loginName 为 QQ 号字符串。
    机器绑定的 session 在所有请求（含 SSE）中必须附带匹配的 X-Machine-Id。
    客户端每 15 秒心跳，租约 45 秒；心跳不会延长 session 有效期。
    收到 ONLINE_TAKEN_OVER 或 NOT_ONLINE 后停止心跳，由用户显式重新上线。
    可选 QQ 群校验在登录、恢复及上线时执行，在线成功结果每 15 分钟复查。
    QQ_GROUP_NOT_MEMBER 的 message 包含目标群号；取消在线资格但保留 Session。
    QQ_GROUP_UNAVAILABLE 暂缓登录、恢复和上线；已有合法在线连接遇到群查询故障时继续续租。
    服务端响应使用 Cache-Control: no-store。部署环境必须使用 HTTPS。
servers:
  - url: https://HOST
security:
  - sessionBearer: []
paths:
  /api/v1/announcements/latest:
    get:
      operationId: getLatestAnnouncement
      summary: 获取启动器首页最新已发布公告
      description: |
        无需 Bearer、Cookie 或 X-Machine-Id。按发布时间倒序、announcementId 倒序选择一条。
        保存草稿不影响返回内容；发布更新全部内容与发布时间，下线后选择其他仍已发布的公告。
        启动器启动及返回首页时获取，两次请求至少间隔 60 秒，超时 8 秒。
        204、请求失败或响应无效时使用启动器内置公告；不持久化远端缓存。
      security: []
      responses:
        '200':
          description: 完整发布快照，不包含编辑稿及管理状态
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Announcement'}
        '204':
          description: 没有已发布公告，无响应正文
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/auth/qq/sessions:
    post:
      operationId: createQqSession
      summary: 验证 QQ 互联登录状态，创建或更新 QQ 账号并签发机器绑定凭证
      description: QQ 身份已验证但未加入指定群时，仍创建或更新账户并记录 QQ_GROUP_NOT_MEMBER 操作日志，返回 403 且不签发新 Session；既有 Session 不因此撤销。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [machineId, qqSessionCookie]
              properties:
                machineId: {type: string, format: uuid, description: Windows MachineGuid}
                qqSessionCookie: {type: string, maxLength: 16384, writeOnly: true, description: 仅包含 get_nick 地址作用域内的 Cookie，不持久化}
      responses:
        '201':
          description: 新的 30 天 Session；其他机器的 Session 已撤销
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QqSessionCredentials'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/GroupRequired'}
        '409':
          description: QQ_ACCOUNT_CONFLICT，保留同名旧密码账号，由管理员处理冲突
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/auth/sessions:
    post:
      operationId: createSession
      summary: 密码登录，不改变在线归属
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [loginName, password]
              properties:
                loginName: {type: string, minLength: 3, maxLength: 64, pattern: '^[a-z0-9_.-]+$'}
                password: {type: string, minLength: 8, maxLength: 128, writeOnly: true, description: 按原样校验，不 trim}
      responses:
        '201':
          description: 新的 30 天 session；token 仅在此返回
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SessionCredentials'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/RateLimited'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/auth/session:
    parameters:
      - {$ref: '#/components/parameters/MachineId'}
    get:
      operationId: getCurrentSession
      summary: 验证已保存的凭证，不续期
      responses:
        '200':
          description: 当前身份；不返回 token 或其他连接的标识
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Identity'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/GroupRequired'}
        '503': {$ref: '#/components/responses/Error'}
    delete:
      operationId: revokeCurrentSession
      summary: 撤销当前 session，同时释放它持有的在线资格
      responses:
        '204': {description: 已撤销；重复使用已撤销凭证返回 401}
        '401': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/auth/online:
    parameters:
      - {$ref: '#/components/parameters/MachineId'}
    post:
      operationId: acquireOnlineConnection
      summary: 显式上线，原子接管账户的在线资格
      description: 每次调用生成新的 connectionId，包括复用同一 session 的不同客户端。
      responses:
        '200':
          description: 新在线连接
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OnlineConnection'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/GroupRequired'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/auth/online/{connectionId}/heartbeat:
    parameters:
      - {$ref: '#/components/parameters/ConnectionId'}
      - {$ref: '#/components/parameters/MachineId'}
    post:
      operationId: heartbeat
      summary: 仅为当前匹配且尚未过期的在线连接续租
      responses:
        '200':
          description: 租约截止时间不晚于 session 截止时间
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OnlineConnection'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/GroupRequired'}
        '409': {$ref: '#/components/responses/OnlineConflict'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/auth/online/{connectionId}:
    parameters:
      - {$ref: '#/components/parameters/ConnectionId'}
      - {$ref: '#/components/parameters/MachineId'}
    delete:
      operationId: leaveOnlineConnection
      summary: 下线但不撤销 session
      description: 已过时、已离线或不属于当前 session 的 connectionId 为幂等空操作，绝不影响新的在线归属。
      responses:
        '204': {description: 请求已处理，session 仍然有效}
        '401': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/auth/online/{connectionId}/events:
    parameters:
      - {$ref: '#/components/parameters/ConnectionId'}
      - {$ref: '#/components/parameters/MachineId'}
    get:
      operationId: subscribeOnlineEvents
      summary: 当前在线连接的 SSE 踢下线通知
      description: |
        建连验证凭证及在线归属，不续租。首个事件为 ready（含 connectionId），每 15 秒发送保活注释。
        kicked 事件携带 KickEvent，随后关闭连接。只重连原 connectionId，不自动调用上线接口。
        推送是尽力投递，重连鉴权及心跳为丢失事件兜底，不支持 Last-Event-ID 补发。
      responses:
        '200':
          description: SSE 事件流
          headers:
            X-Accel-Buffering: {schema: {type: string, const: 'no'}}
          content:
            text/event-stream:
              schema: {type: string}
        '401': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/OnlineConflict'}
        '503': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    sessionBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-session-token
      description: 32 随机字节的无填充 Base64URL；sessionId 本身不是凭证
  parameters:
    MachineId:
      name: X-Machine-Id
      in: header
      required: false
      description: 对 QQ 机器绑定 Session 必填，缺失或不匹配返回 401；旧密码 Session 不要求此字段
      schema: {type: string, format: uuid}
    ConnectionId:
      name: connectionId
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    Announcement:
      type: object
      required: [announcementId, title, summary, bodyMarkdown, publishedAt]
      properties:
        announcementId: {type: string, format: uuid}
        title: {type: string, minLength: 1, maxLength: 120, description: 纯文本标题；长度限制按 UTF-16 代码单元计数}
        summary: {type: string, minLength: 1, maxLength: 500, description: 纯文本摘要；长度限制按 UTF-16 代码单元计数}
        bodyMarkdown: {type: string, minLength: 1, maxLength: 65536, description: Markdown 正文；长度限制按 UTF-16 代码单元计数，支持标题、段落、列表、粗体、斜体及行内代码}
        publishedAt: {type: string, format: date-time, description: 最近一次发布的 UTC 时间}
    SessionCredentials:
      type: object
      required: [sessionId, sessionToken, expiresAt]
      properties:
        sessionId: {type: string, format: uuid}
        sessionToken: {type: string, pattern: '^[A-Za-z0-9_-]{43}$'}
        expiresAt: {type: string, format: date-time}
    Identity:
      type: object
      required: [accountId, sessionId, loginName, expiresAt]
      properties:
        accountId: {type: string, format: uuid}
        sessionId: {type: string, format: uuid}
        loginName: {type: string}
        expiresAt: {type: string, format: date-time}
        machineId: {type: [string, 'null'], format: uuid}
        qqNumber: {type: [string, 'null'], description: QQ 号，不使用 JSON 数值表示}
        nickname: {type: [string, 'null']}
        avatarUrl: {type: [string, 'null'], format: uri}
    QqSessionCredentials:
      allOf:
        - {$ref: '#/components/schemas/SessionCredentials'}
        - {$ref: '#/components/schemas/Identity'}
        - type: object
          required: [machineId, qqNumber, nickname, avatarUrl]
    KickEvent:
      type: object
      required: [accountId, sessionId, connectionId, reason]
      properties:
        accountId: {type: string, format: uuid}
        sessionId: {type: string, format: uuid}
        connectionId: {type: string, format: uuid}
        reason: {type: string, enum: [MACHINE_CHANGED, ONLINE_TAKEN_OVER, ADMIN_REVOKED, ACCOUNT_DISABLED, SESSION_REVOKED, QQ_GROUP_NOT_MEMBER]}
        groupNumber: {type: [string, 'null'], description: QQ_GROUP_NOT_MEMBER 时为目标群号；其他原因可为空或省略}
    OnlineConnection:
      type: object
      required: [connectionId, leaseExpiresAt, heartbeatIntervalSeconds]
      properties:
        connectionId: {type: string, format: uuid}
        leaseExpiresAt: {type: string, format: date-time}
        heartbeatIntervalSeconds: {type: integer, const: 15}
    Error:
      type: object
      required: [code, message, requestId, retryable]
      properties:
        code: {type: string}
        message: {type: string}
        requestId: {type: string, format: uuid}
        retryable: {type: boolean}
  responses:
    GroupRequired:
      description: QQ_GROUP_NOT_MEMBER；message 包含目标群号码，加入后可重新上线，不撤销已有 Session。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Error:
      description: INVALID_INPUT / INVALID_CREDENTIALS / SERVICE_UNAVAILABLE / QQ_GROUP_UNAVAILABLE；503 可重试，401 需要重新登录
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    RateLimited:
      description: LOGIN_RATE_LIMITED
      headers:
        Retry-After: {schema: {type: integer, const: 300}}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    OnlineConflict:
      description: ONLINE_TAKEN_OVER 或 NOT_ONLINE。停止心跳；如需上线，显式调用 acquireOnlineConnection。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
